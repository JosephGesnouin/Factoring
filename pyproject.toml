[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reconciliation-ai"
version = "1.0.0"
description = "AI-powered payment-invoice reconciliation system for factoring (6-layer architecture)"
requires-python = ">=3.10"
dependencies = [
    "unidecode>=1.3",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
]
nlp = [
    "rapidfuzz>=3.0",
    "sentence-transformers>=2.2",
]
llm = [
    "anthropic>=0.30",
    "openai>=1.0",
]
all = [
    "reconciliation-ai[ml,nlp,llm]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["reconciliation*"]
